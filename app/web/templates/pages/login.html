{% extends "base.html" %}
{% set bare = True %}
{% block bare_content %}
<div class="card bg-base-100 shadow">
  <div class="card-body">
    <h1 class="card-title">{{ t("auth.login.title") }} — {{ t("app.name") }}</h1>
    <p class="text-sm text-base-content/70">{{ t("app.tagline") }}</p>
    <form data-login-form data-next="{{ next }}" method="post" action="/api/v1/admin/login" novalidate
      data-msg-generic="{{ t("auth.login.generic_error") }}"
      data-msg-rate-limited="{{ t("auth.login.rate_limited") }}"
      data-msg-unavailable="{{ t("auth.login.unavailable") }}"
      data-msg-network="{{ t("auth.login.network_error") }}">
      <div class="form-control">
        <label class="label" for="username"><span class="label-text">{{ t("auth.login.username") }}</span></label>
        <input id="username" name="username" type="text" autocomplete="username" required class="input input-bordered w-full">
      </div>
      <div class="form-control mt-2">
        <label class="label" for="password"><span class="label-text">{{ t("auth.login.password") }}</span></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required class="input input-bordered w-full">
      </div>
      <p data-login-error class="alert alert-error mt-4" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary mt-4 w-full">
        {% include "icons/log-in.svg" %}
        {{ t("auth.login.submit") }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
