# LogCarve bot-claim rules, version 3.
#
# Provenance: 70 of 75 entries adapted 2026-11-01 from the public LogWerk
# rule catalog (`parser.js` `botRules`) at pinned commit
# d7ab01cae910fdd0c5165ee8378506c081c7124a. Upstream MIT license and
# copyright are retained verbatim in THIRD_PARTY_NOTICES.md. Only the
# match patterns, display names and provider/purpose claims were reused;
# category mapping, precedence order, rule IDs, matcher form
# (`ua_contains`/`ua_regex`) and the automation remap below are new LogCarve
# work. No LogWerk application code, session/person inference or sample
# data was copied. The 5 `bot-search-*`/`bot-ai-*` rules from v2 keep
# their IDs; specifics stay before generics so first match wins.
# Two ORIGINAL LogCarve rules close the catalog: an UptimeRobot monitoring
# rule (documented at
# https://help.uptimerobot.com/en/articles/11358466-how-to-debug-a-monitor-showing-as-down-in-uptimerobot,
# UA contains "UptimeRobot") and a generic suspected-automation fallback
# (`bot`, `crawl`, `spider`, `scrap`, `scan` signals) ordered after every
# named rule, so named claims always win and generic signals are labeled
# suspected automation, never proven crawler or human.
#
# A match proves a CLAIMED User-Agent identity only; verification
# (reverse/forward DNS) is an explicit P1 non-goal. `provider`/`purpose`
# are configured claims from upstream labels, never proof of training
# use, indexing or verified identity. Every consumer must surface the
# `meaning` wording instead of asserting a verified crawler.
#
# Documented remaps from upstream types: CLI/HTTP clients, headless
# browsers and security scanners -> `automation_tool`; search-engine
# media/preview/ads fetchers -> `search_crawler`; performance auditors
# (Lighthouse) -> `automation_tool`; generic crawlers, archivers and
# plagiarism checkers -> `generic_bot`; social -> `social_bot`;
# federation -> `federation_crawler`; feeds -> `feed_fetcher`.
version: 3
provenance: "LogCarve MVP bot claims v3: 5 hand-authored rules kept, 70 adapted from public LogWerk parser.js at d7ab01cae910fdd0c5165ee8378506c081c7124a (MIT, see THIRD_PARTY_NOTICES.md), 2 original monitoring/fallback rules; UA match only, verification deferred to P1"
